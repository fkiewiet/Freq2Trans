sweep_id: campaign_65h_continue_depth5_anchor_32_64
description: >
  Optional second lane: continue only the depth5 32->64 run. Use this if the
  current depth5 checkpoint is competitive or if base32 has already plateaued.

root_outdir: /orcd/scratch/orcd/006/fkiewiet/freq2transfer/precond_2d_rigorous/phase1_verified_all_pairs
log_dir: /orcd/scratch/orcd/006/fkiewiet/freq2transfer/slurm_logs
