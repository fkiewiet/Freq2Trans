sweep_id: phase1_residual_up_20260501
description: >
  Residual-weighted phase-one sweep. Runs all frequency pairs so the residual
  objective can be compared directly against the field-loss phase-one baseline.

root_outdir: /orcd/scratch/orcd/006/fkiewiet/freq2transfer/precond_v3_sweeps/phase1_residual_up_20260501
current_outdir: /orcd/scratch/orcd/006/fkiewiet/freq2transfer/precond_v3_runs
log_dir: /orcd/scratch/orcd/006/fkiewiet/freq2transfer/slurm_logs
launcher: experiments/claude/precond_v3/launch/sbatch_pair_up_staged.sh

pairs:
  - "16_32"
  - "32_64"
  - "64_128"

resources:
  partition: mit_preemptable
  time: "12:00:00"
  cpus_per_task: 4
  mem: 64G
  gres: gpu:1

defaults:
  direction: up
  max_runtime_h: 10.5
  num_workers: 0
  args:
    epochs: 1000
    early_stop: 10000
    lr_patience: 40
    fresh: true

experiments:
  - id: residual_w1e-4_base32
    hypothesis: small operator-weighted penalty improves solver-relevant high-frequency consistency without overwhelming field fit.
    args:
      residual_weight: 1.0e-4
      residual_kind: helmholtz_error

  - id: residual_w1e-3_base32
    hypothesis: moderate operator-weighted penalty tests objective mismatch as the main bottleneck.
    args:
      residual_weight: 1.0e-3
      residual_kind: helmholtz_error

  - id: residual_w1e-2_base32
    hypothesis: strong operator-weighted penalty stress-tests whether residual alignment beats field-only learning.
    args:
      residual_weight: 1.0e-2
      residual_kind: helmholtz_error

  - id: residual_w1e-3_base48
    hypothesis: residual alignment plus a modestly wider model tests objective and capacity together after the base residual check.
    args:
      base_ch: 48
      residual_weight: 1.0e-3
      residual_kind: helmholtz_error
